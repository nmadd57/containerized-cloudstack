[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; CloudStack management server via embedded jetty.
; No simulator flag — this is the real management plane.
[program:cloudstack]
command=mvn -pl client jetty:run -Dorg.eclipse.jetty.annotations.maxWait=120
directory=/cloudstack
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64",MAVEN_OPTS="-Xmx3g -XX:MaxMetaspaceSize=512m"
